<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f2547" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>ساحة العقبة</title>
    <script>
      // Before the first paint: a dark screen must never flash white while
      // React boots. 'system' (or nothing stored) follows the device.
      (function () {
        try {
          var saved = localStorage.getItem('yard-theme');
          var dark =
            saved === 'dark' ||
            (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* private mode: the light theme is a fine default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
