# Pushing a version tag (v1.0.0 …) verifies the project, builds the client,
# and publishes a GitHub Release carrying a ready-to-deploy bundle.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # node:sqlite needs Node 24; bun runs the scripts, node runs the server.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build

      - name: Package the deployable bundle
        run: |
          mkdir -p release
          tar -czf "release/aqaba-yard-${GITHUB_REF_NAME}.tar.gz" \
            dist src/server src/shared package.json bun.lock

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
